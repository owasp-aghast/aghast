version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-actions:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/.github/semgrep"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/.github/opencode-install"
    schedule:
      interval: "weekly"
